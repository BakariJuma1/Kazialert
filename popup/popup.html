<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kazi Alert</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;">
  <defs>
    <symbol id="ic-zap"      viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="ic-scan"     viewBox="0 0 24 24"><polyline points="23 6 23 1 18 1"/><line x1="1" y1="6" x2="23" y2="6"/><polyline points="1 1 1 6"/><polyline points="23 18 23 23 18 23"/><line x1="1" y1="18" x2="23" y2="18"/><polyline points="1 23 1 18"/></symbol>
    <symbol id="ic-warning"  viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  </defs>
</svg>

<div class="container">

  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg class="icon" aria-hidden="true"><use href="#ic-zap"/></svg>
      </div>
      <span class="logo-text">Kazi Alert</span>
    </div>
    <a href="#" class="icon-btn" id="settingsBtn" title="Open settings">
      <svg class="icon" aria-hidden="true"><use href="#ic-settings"/></svg>
    </a>
  </header>

  <div class="banner banner--warning hidden" id="setupBanner">
    <svg class="icon icon-sm" aria-hidden="true"><use href="#ic-warning"/></svg>
    <span>Setup required — add your CV &amp; email</span>
    <a href="#" id="setupLink">Open Settings →</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total matched</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This week</div>
      <div class="stat-value" id="statWeek">—</div>
    </div>
    <div class="stat-card stat-card--applied">
      <div class="stat-label">Applied</div>
      <div class="stat-value stat-value--accent" id="statApplied">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last scan</div>
      <div class="stat-value stat-value--sm" id="statLastCheck">—</div>
    </div>
  </div>

  <div class="info-row" id="cvRow">
    <div class="info-row-left">
      <span class="dot" id="cvDot"></span>
      <span id="cvLabel">Loading…</span>
    </div>
    <button class="ghost-btn" id="cvBtn">Change</button>
  </div>

  <div class="info-row">
    <div class="info-row-left">
      <span class="row-tag">Email</span>
      <span class="row-value" id="emailValue">Not set</span>
    </div>
  </div>

  <button class="btn btn--primary" id="checkBtn" disabled>
    <svg class="icon icon-sm" aria-hidden="true"><use href="#ic-scan"/></svg>
    <span id="checkLabel">Scan Now</span>
    <span class="spinner hidden" id="checkSpinner"></span>
  </button>

</div>
<script type="module" src="popup.js"></script>
</body>
</html>
